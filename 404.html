<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Down — Piano Leads</title>
    <link rel="icon" type="image/png" href="/piano1.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .container {
        max-width: 480px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #fff;
      }
      p {
        font-size: 1.1rem;
        color: #aaa;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }
      a {
        color: #7c6af7;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid #7c6af7;
        padding-bottom: 1px;
        transition: opacity 0.15s;
      }
      a:hover {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Site Currently Down</h1>
      <p>Piano Leads is temporarily unavailable. Check back soon.</p>
      <p>
        Visit
        <a href="https://benyellow.com" target="_blank" rel="noopener"
          >benyellow.com</a
        >
      </p>
    </div>
  </body>
</html>
